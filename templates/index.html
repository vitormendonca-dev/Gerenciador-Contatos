<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contatos</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main>
  <h1>Contatos</h1>

  <div class="api-bar">
    <span class="dot" id="dot" title="Status da API"></span>
    <input type="text" id="apiUrl" value="http://localhost:5000" aria-label="URL base da API">
    <button id="reconnect" type="button">Conectar</button>
  </div>

  <p class="error" id="error" hidden></p>

  <form class="card" id="form">
    <h2 id="formTitle">Novo contato</h2>
    <div class="grid">
      <div class="full">
        <label for="name">Nome</label>
        <input type="text" id="name" required>
      </div>
      <div>
        <label for="phone">Telefone</label>
        <input type="tel" id="phone">
      </div>
      <div>
        <label for="email">Email</label>
        <input type="email" id="email">
      </div>
    </div>
    <div class="actions">
      <button class="primary" type="submit" id="submitBtn">Adicionar contato</button>
      <button type="button" id="cancelBtn" hidden>Cancelar edição</button>
    </div>
  </form>

  <div class="toolbar">
    <input type="search" id="search" placeholder="Buscar por nome" aria-label="Buscar contato por nome">
    <span class="count" id="count"></span>
  </div>

  <ul id="list"></ul>
</main>

<script src="/static/script.js"></script>
</body>
</html>
