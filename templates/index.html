<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contatos</title>
<style>
  :root {
    --bg: #f5f3f0;
    --surface: #ffffff;
    --text: #25201c;
    --muted: #70675f;
    --line: #ddd6ce;
    --accent: #2f5d8a;
    --accent-text: #ffffff;
    --danger: #b3382c;
    --ok: #2e7d4f;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17191c;
      --surface: #202327;
      --text: #e8e9ea;
      --muted: #8e949b;
      --line: #30353b;
      --accent: #6fa3d6;
      --accent-text: #0f1a26;
      --danger: #e5776b;
      --ok: #5fc08a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif; line-height: 1.5;
  }
  main { max-width: 640px; margin: 0 auto; padding: 40px 20px 80px; }
  h1 { font-size: 1.75rem; margin: 0 0 4px; letter-spacing: -0.01em; }
  h2 { font-size: 1.05rem; margin: 0 0 12px; }
  .sub { color: var(--muted); margin: 0 0 24px; font-size: 0.95rem; }
  .api-bar { display: flex; gap: 8px; align-items: center; margin-bottom: 20px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.ok { background: var(--ok); }
  .dot.fail { background: var(--danger); }
  input[type="text"], input[type="email"], input[type="tel"], input[type="search"] {
    font: inherit; color: var(--text); background: var(--surface);
    border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; width: 100%;
  }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 4px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; margin-bottom: 24px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grid .full { grid-column: 1 / -1; }
  @media (max-width: 520px) { .grid { grid-template-columns: 1fr; } }
  .actions { display: flex; gap: 8px; margin-top: 14px; }
  button {
    font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line);
    background: var(--surface); color: var(--text); padding: 10px 14px;
  }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
  button.small { padding: 4px 10px; font-size: 0.85rem; }
  button.danger { color: var(--danger); }
  .error { color: var(--danger); margin: 0 0 16px; font-size: 0.9rem; white-space: pre-wrap; }
  .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; }
  .toolbar input { max-width: 260px; }
  .count { color: var(--muted); font-size: 0.85rem; }
  ul { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
  li { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  li:last-child { border-bottom: 0; }
  .avatar {
    width: 38px; height: 38px; border-radius: 50%; flex: none;
    background: var(--accent); color: var(--accent-text);
    display: grid; place-items: center; font-weight: 600;
  }
  .info { flex: 1; min-width: 0; }
  .info .name { font-weight: 600; word-break: break-word; }
  .info .detail { color: var(--muted); font-size: 0.9rem; word-break: break-word; }
  .msg { padding: 16px; color: var(--muted); text-align: center; flex: 1; }
</style>
</head>
<body>
<main>
  <h1>Contatos</h1>
  <p class="sub">Front pronto. O backend é com você.</p>

  <div class="api-bar">
    <span class="dot" id="dot" title="Status da API"></span>
    <input type="text" id="apiUrl" value="http://localhost:5000" aria-label="URL base da API">
    <button id="reconnect" type="button">Conectar</button>
  </div>

  <p class="error" id="error" hidden></p>

  <form class="card" id="form">
    <h2 id="formTitle">Novo contato</h2>
    <div class="grid">
      <div class="full">
        <label for="name">Nome</label>
        <input type="text" id="name" required>
      </div>
      <div>
        <label for="phone">Telefone</label>
        <input type="tel" id="phone">
      </div>
      <div>
        <label for="email">Email</label>
        <input type="email" id="email">
      </div>
    </div>
    <div class="actions">
      <button class="primary" type="submit" id="submitBtn">Adicionar contato</button>
      <button type="button" id="cancelBtn" hidden>Cancelar edição</button>
    </div>
  </form>

  <div class="toolbar">
    <input type="search" id="search" placeholder="Buscar por nome" aria-label="Buscar contato por nome">
    <span class="count" id="count"></span>
  </div>

  <ul id="list"></ul>
</main>

<script>
  // ============================================================
  // CONTRATO DA API (o seu backend precisa implementar isto):
  //
  //  GET    /contacts       -> 200  [ { id, name, phone, email }, ... ]
  //  POST   /contacts       -> 201  { id, name, phone, email }
  //                            body: { name, phone, email }
  //  PUT    /contacts/:id   -> 200  { id, name, phone, email }
  //                            body: { name, phone, email }
  //  DELETE /contacts/:id   -> 204  (sem corpo)
  //
  //  Erros: devolva 400 (dados inválidos) ou 404 (id não existe).
  //  Lembre de habilitar CORS no backend.
  // ============================================================

  const $ = (id) => document.getElementById(id);
  let contacts = [];
  let editingId = null;

  const baseUrl = () => $('apiUrl').value.trim().replace(/\/$/, '');

  function showError(msg) {
    $('error').textContent = msg;
    $('error').hidden = !msg;
  }

  async function api(path, options = {}) {
    const res = await fetch(baseUrl() + path, {
      headers: { 'Content-Type': 'application/json' },
      ...options,
    });
    if (!res.ok) {
      const text = await res.text().catch(() => '');
      throw new Error(`Erro ${res.status} em ${options.method || 'GET'} ${path}\n${text}`);
    }
    return res.status === 204 ? null : res.json();
  }

  async function load() {
    try {
      contacts = await api('/contacts');
      $('dot').className = 'dot ok';
      showError('');
    } catch (e) {
      $('dot').className = 'dot fail';
      contacts = [];
      showError(e instanceof TypeError
        ? 'Não consegui falar com a API. Ela está rodando? O CORS está habilitado?'
        : e.message);
    }
    render();
  }

  async function run(action) {
    try {
      await action();
      showError('');
      await load();
      return true;
    } catch (e) {
      showError(e.message);
      return false;
    }
  }

  function resetForm() {
    editingId = null;
    $('form').reset();
    $('formTitle').textContent = 'Novo contato';
    $('submitBtn').textContent = 'Adicionar contato';
    $('cancelBtn').hidden = true;
  }

  function startEdit(c) {
    editingId = c.id;
    $('name').value = c.name || '';
    $('phone').value = c.phone || '';
    $('email').value = c.email || '';
    $('formTitle').textContent = 'Editar contato';
    $('submitBtn').textContent = 'Salvar alterações';
    $('cancelBtn').hidden = false;
    $('name').focus();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function render() {
    const term = $('search').value.trim().toLowerCase();
    const shown = contacts.filter((c) => (c.name || '').toLowerCase().includes(term));
    const list = $('list');
    list.innerHTML = '';

    if (!shown.length) {
      const li = document.createElement('li');
      const span = document.createElement('span');
      span.className = 'msg';
      span.textContent = contacts.length
        ? 'Nenhum contato encontrado para essa busca.'
        : 'Nenhum contato ainda. Preencha o formulário acima para adicionar o primeiro.';
      li.appendChild(span);
      list.appendChild(li);
    }

    shown.forEach((c) => {
      const li = document.createElement('li');

      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.textContent = (c.name || '?').trim().charAt(0).toUpperCase();
      li.appendChild(avatar);

      const info = document.createElement('div');
      info.className = 'info';
      const name = document.createElement('div');
      name.className = 'name';
      name.textContent = c.name;
      const detail = document.createElement('div');
      detail.className = 'detail';
      detail.textContent = [c.phone, c.email].filter(Boolean).join('  |  ') || 'Sem telefone ou email';
      info.appendChild(name);
      info.appendChild(detail);
      li.appendChild(info);

      const edit = document.createElement('button');
      edit.className = 'small';
      edit.textContent = 'Editar';
      edit.onclick = () => startEdit(c);
      li.appendChild(edit);

      const del = document.createElement('button');
      del.className = 'small danger';
      del.textContent = 'Excluir';
      del.onclick = () => {
        if (!confirm(`Excluir o contato "${c.name}"?`)) return;
        if (editingId === c.id) resetForm();
        run(() => api(`/contacts/${c.id}`, { method: 'DELETE' }));
      };
      li.appendChild(del);

      list.appendChild(li);
    });

    $('count').textContent = contacts.length
      ? `${shown.length} de ${contacts.length} contatos`
      : '';
  }

  $('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const body = JSON.stringify({
      name: $('name').value.trim(),
      phone: $('phone').value.trim(),
      email: $('email').value.trim(),
    });
    const ok = editingId === null
      ? await run(() => api('/contacts', { method: 'POST', body }))
      : await run(() => api(`/contacts/${editingId}`, { method: 'PUT', body }));
    if (ok) resetForm();
  });

  $('cancelBtn').addEventListener('click', resetForm);
  $('search').addEventListener('input', render);
  $('reconnect').addEventListener('click', load);
  load();
</script>
</body>
</html>
